<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — JAYANT SYSTEMS</title>
  <style>
    :root {
      --background: #F8FAFC;
      --foreground: #0F172A;
      --muted: #475569;
      --border: #E2E8F0;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --card-bg: #FFFFFF;
      --grid-color: rgba(15, 23, 42, 0.03);
      --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0A0F1D;
        --foreground: #F8FAFC;
        --muted: #94A3B8;
        --border: #1E293B;
        --primary: #3B82F6;
        --primary-hover: #2563EB;
        --card-bg: #111827;
        --grid-color: rgba(248, 250, 252, 0.02);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--background);
      background-image: 
        linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
      background-size: 48px 48px;
      color: var(--foreground);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .offline-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(10, 15, 29, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .logo-container {
      width: 56px;
      height: 56px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A0F1D;
      border: 1px solid #1E293B;
      border-radius: 12px;
      margin-bottom: 28px;
      box-shadow: 0 4px 12px rgba(10, 15, 29, 0.15);
      color: #F8FAFC;
    }

    .logo-svg {
      width: 100%;
      height: 100%;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    p {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 28px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }

    .try-again-btn {
      background: var(--primary);
      color: #FFFFFF;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 10px;
      padding: 12px 36px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }

    .try-again-btn:hover {
      transform: translateY(-1px);
      background: var(--primary-hover);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
    }

    .try-again-btn:active {
      transform: translateY(1px);
    }

    .try-again-btn:disabled {
      background: var(--muted);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
      opacity: 0.6;
    }

    .try-again-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .status-msg {
      margin-top: 20px;
      font-size: 13px;
      font-weight: 500;
      display: none;
      padding: 10px 16px;
      border-radius: 10px;
      max-width: 360px;
    }

    .status-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.15);
      color: #EF4444;
    }

    .status-msg.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.15);
      color: #10B981;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .shake {
      animation: shake 0.3s ease-in-out;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="logo-container">
      <svg viewBox="0 0 120 120" class="logo-svg" aria-hidden="true" fill="none">
        <rect x="22" y="26" width="10" height="10" rx="2" fill="#3B82F6" />
        <path d="M38 26H53V74C53 85.0457 44.0457 94 33 94H22V80H32C35.866 80 38 77.866 38 74V26Z" fill="#F8FAFC" />
        <path d="M64 26H98V40H76V52H88C94.6274 52 100 57.3726 100 64V82C100 88.6274 94.6274 94 88 94H62V80H85V66H73C66.3726 66 61 60.6274 61 54V38C61 31.3726 66.3726 26 73 26H64Z" fill="#3B82F6" />
      </svg>
    </div>
    
    <h1>You're Offline</h1>
    <p>It looks like your device isn't connected to the internet right now. Some features may be temporarily unavailable.</p>
    
    <button id="try-again-btn" class="try-again-btn">Try Again</button>
    
    <div id="status-msg" class="status-msg"></div>
  </div>

  <script>
    const button = document.getElementById('try-again-btn');
    const statusMsg = document.getElementById('status-msg');

    button.addEventListener('click', async () => {
      button.disabled = true;
      button.textContent = 'Verifying connection...';
      statusMsg.style.display = 'none';

      // 1. Initial browser connectivity check
      if (!navigator.onLine) {
        showOffline();
        return;
      }

      // 2. Ping check for actual internet access (against a server endpoint)
      try {
        const response = await fetch('/favicon.ico?_cb=' + Date.now(), {
          method: 'HEAD',
          cache: 'no-store'
        });
        
        if (response.ok) {
          statusMsg.className = 'status-msg success';
          statusMsg.textContent = 'Connection restored! Reloading page...';
          statusMsg.style.display = 'block';
          setTimeout(() => {
            // Reload the requested URL directly
            window.location.reload();
          }, 600);
        } else {
          showOffline();
        }
      } catch (e) {
        showOffline();
      }
    });

    function showOffline() {
      button.disabled = false;
      button.textContent = 'Try Again';
      statusMsg.className = 'status-msg error';
      statusMsg.textContent = 'Still offline. Please check your network connection.';
      statusMsg.style.display = 'block';
      
      // Shake animation on the card/button
      button.classList.add('shake');
      setTimeout(() => button.classList.remove('shake'), 300);
    }

    // Automatically reload when network status triggers 'online'
    window.addEventListener('online', () => {
      statusMsg.className = 'status-msg success';
      statusMsg.textContent = 'Connection detected! Reloading...';
      statusMsg.style.display = 'block';
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    });
  </script>
</body>
</html>
