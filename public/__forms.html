<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head>
<body>
<!-- Netlify Forms registration. Do not delete: ContactForm.tsx posts to this file.
     Field names must match the ones sent by ContactForm.tsx. -->
<form name="project-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="project-inquiry">
  <input name="bot-field">
  <input name="name">
  <input name="company">
  <input type="email" name="email">
  <input name="phone">
  <input name="projectType">
  <input name="budget">
  <input name="timeline">
  <textarea name="description"></textarea>
  <input name="agreement">
</form>
</body>
</html>
